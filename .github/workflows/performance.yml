name: Core performance

on:
  push:
    branches: [performance-baseline, performance-optimized]
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Source commit to measure (empty means workflow revision)'
        type: string
        default: ''
      mode:
        description: 'Independent frame scenarios or Baseline Profile generation'
        type: choice
        options: [frames, profiles, startup]
        default: frames
      trace_compose:
        description: 'Opt into detailed Compose in-process tracing (adds collection overhead)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  ORG_GRADLE_PROJECT_traceCompose: ${{ inputs.trace_compose && 'true' || 'false' }}

jobs:
  measure:
    if: github.event_name != 'push' || !github.event.deleted
    name: measure-${{ inputs.source_commit || github.sha }}-${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON((inputs.mode == 'profiles' || inputs.mode == 'startup') && '["all"]' || '["galleryList","galleryGrid","pager","webtoon","navigation","drawer"]') }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_commit || github.sha }}
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0 cmake;3.31.6 ndk;30.0.16248370'
      - name: Install native build prerequisites
        run: |
          command -v m4 || { sudo apt-get update && sudo apt-get install -y m4; }
          rustup toolchain install "$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')" --profile minimal --component rust-src,rustfmt,clippy --target aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: app/src/main/rust
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Load the measurement fixture for this workflow revision
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git archive "$GITHUB_SHA" benchmark app/src/benchmark tools/performance_report.py | tar -x
          python3 - <<'PY_FIXTURE'
          from pathlib import Path
          import os, re, subprocess
          path = Path('app/build.gradle.kts')
          original = path.read_text()
          current = subprocess.check_output(['git', 'show', os.environ['GITHUB_SHA']+':app/build.gradle.kts'], text=True)
          for key in ('versionCode', 'versionName'):
              value = re.search(r'^\s*'+key+r' = (.+)$', original, re.M).group(1)
              current = re.sub(r'(?m)^(\s*'+key+r' = ).+$', lambda m: m.group(1)+value, current)
          path.write_text(current)
          print('Selected app/main and core source retained; benchmark build configuration follows this workflow revision')
          PY_FIXTURE
          git diff --exit-code -- app/src/main core
          git rev-parse HEAD
      - name: Compile the selected performance variant
        env:
          MODE: ${{ inputs.mode || 'frames' }}
        run: |
          if [ "$MODE" = profiles ]; then
            ./gradlew :benchmark:assembleDefaultNonMinifiedRelease :app:assembleDefaultNonMinifiedRelease --no-configuration-cache --max-workers=2 -PbuildAbis=x86_64 -Pkotlin.compiler.execution.strategy=in-process --stacktrace
          else
            ./gradlew :benchmark:assembleDefaultBenchmarkRelease :app:assembleDefaultBenchmarkRelease --no-configuration-cache --max-workers=2 -PbuildAbis=x86_64 -Pkotlin.compiler.execution.strategy=in-process --stacktrace
          fi
      - name: Check fixture manifest in the actual benchmark APK
        run: |
          python3 - <<'PY_CHECK'
          from pathlib import Path
          import os, subprocess
          apks = list(Path('app/build/outputs/apk/default').glob('*Release/*.apk'))
          assert apks
          for apk in apks:
              manifest = subprocess.check_output([os.environ['ANDROID_HOME']+'/build-tools/37.0.0/aapt', 'dump', 'xmltree', str(apk), 'AndroidManifest.xml'], text=True)
              assert 'com.hippo.ehviewer.BENCHMARK' in manifest, f'Fixture entry missing: {apk}'
          PY_CHECK
      - uses: ReactiveCircus/android-emulator-runner@v2.38.0
        env:
          MODE: ${{ inputs.mode || 'frames' }}
        with:
          api-level: 35
          profile: pixel_6
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          heap-size: 512M
          force-avd-creation: true
          disable-animations: false
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb shell settings put system screen_off_timeout 1800000
            adb shell svc wifi disable
            adb shell svc data disable
            if [ "$MODE" = profiles ]; then ./gradlew :app:generateBaselineProfile --no-configuration-cache --max-workers=2 -PbuildAbis=x86_64 -Pkotlin.compiler.execution.strategy=in-process --stacktrace; elif [ "$MODE" = startup ]; then ./gradlew :app:generateBaselineProfile --no-configuration-cache --max-workers=2 -PbuildAbis=x86_64 -Pkotlin.compiler.execution.strategy=in-process --stacktrace && ./gradlew :benchmark:connectedDefaultBenchmarkReleaseAndroidTest --no-configuration-cache --max-workers=2 -PbuildAbis=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=com.ehviewer.benchmark.StartupBenchmarks -Pkotlin.compiler.execution.strategy=in-process --stacktrace; else ./gradlew :benchmark:connectedDefaultBenchmarkReleaseAndroidTest --no-configuration-cache --max-workers=2 -PbuildAbis=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=com.ehviewer.benchmark.FrameBenchmarks#${{ matrix.scenario }} -Pkotlin.compiler.execution.strategy=in-process --stacktrace; fi
      - name: Summarize independent frame or startup measurements
        if: inputs.mode != 'profiles'
        run: |
          curl --fail --location --retry 2 https://commondatastorage.googleapis.com/perfetto-luci-artifacts/v59.1/linux-amd64/trace_processor_shell --output "$RUNNER_TEMP/trace_processor_shell"
          echo "2434129a3af4dc9e2034a476f7b76447b490975213e301769310d3bd0d5d6458  $RUNNER_TEMP/trace_processor_shell" | sha256sum -c
          chmod +x "$RUNNER_TEMP/trace_processor_shell"
          python3 tools/performance_report.py benchmark/build/outputs --output performance-report.md --trace-processor "$RUNNER_TEMP/trace_processor_shell"
          cat performance-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: performance-${{ inputs.mode || 'frames' }}-${{ inputs.source_commit || github.sha }}-${{ matrix.scenario }}
          path: |
            performance-report.md
            perfetto-sections/
            app/src/main/generated/baselineProfiles/
            benchmark/build/outputs/
            !benchmark/build/outputs/apk/**
            benchmark/build/reports/
            app/build/intermediates/merged_baseline_profile/
            app/build/intermediates/merged_startup_profile/
            app/build/generated/baselineProfiles/
          if-no-files-found: warn
          retention-days: 7
