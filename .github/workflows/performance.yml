name: Core performance

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Source commit to measure (empty means workflow revision)'
        type: string
        default: ''
      mode:
        description: 'Independent frame scenarios or Baseline Profile generation'
        type: choice
        options: [frames, profiles, startup]
        default: frames

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_commit || github.sha }}
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0 cmake;3.31.6 ndk;30.0.16248370'
      - name: Install native build prerequisites
        run: |
          command -v m4 || { sudo apt-get update && sudo apt-get install -y m4; }
          rustup toolchain install "$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')" --profile minimal --component rust-src,rustfmt,clippy --target aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: app/src/main/rust
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile the selected performance variant
        env:
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = profiles ]; then
            ./gradlew :benchmark:assembleDefaultNonMinifiedRelease :app:assembleDefaultNonMinifiedRelease --no-configuration-cache --max-workers=2 -PbuildAbis=x86_64 -Pkotlin.compiler.execution.strategy=in-process --stacktrace
          else
            ./gradlew :benchmark:assembleDefaultBenchmarkRelease :app:assembleDefaultBenchmarkRelease --no-configuration-cache --max-workers=2 -PbuildAbis=x86_64 -Pkotlin.compiler.execution.strategy=in-process --stacktrace
          fi
      - uses: ReactiveCircus/android-emulator-runner@v2.38.0
        env:
          MODE: ${{ inputs.mode }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          heap-size: 512M
          force-avd-creation: true
          disable-animations: false
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb shell settings put system screen_off_timeout 1800000
            if [ "$MODE" = profiles ]; then ./gradlew :app:generateBaselineProfile --no-configuration-cache --max-workers=2 -PbuildAbis=x86_64 -Pkotlin.compiler.execution.strategy=in-process --stacktrace; elif [ "$MODE" = startup ]; then ./gradlew :benchmark:connectedDefaultBenchmarkReleaseAndroidTest --no-configuration-cache --max-workers=2 -PbuildAbis=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=com.ehviewer.benchmark.StartupBenchmarks -Pkotlin.compiler.execution.strategy=in-process --stacktrace; else ./gradlew :benchmark:connectedDefaultBenchmarkReleaseAndroidTest --no-configuration-cache --max-workers=2 -PbuildAbis=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=com.ehviewer.benchmark.FrameBenchmarks -Pkotlin.compiler.execution.strategy=in-process --stacktrace; fi
      - name: Summarize independent frame or startup measurements
        if: inputs.mode != 'profiles'
        run: |
          python3 tools/performance_report.py benchmark/build/outputs --output performance-report.md
          cat performance-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: performance-${{ inputs.mode }}-${{ inputs.source_commit || github.sha }}
          path: |
            performance-report.md
            app/src/main/generated/baselineProfiles/
            benchmark/build/outputs/
            benchmark/build/reports/
            app/build/intermediates/merged_baseline_profile/
            app/build/intermediates/merged_startup_profile/
            app/build/generated/baselineProfiles/
          if-no-files-found: warn
          retention-days: 7
