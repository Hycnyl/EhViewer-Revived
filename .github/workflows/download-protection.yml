name: Download file protection

on:
  pull_request:
    paths:
      - 'app/src/main/cpp/archive.c'
      - 'app/src/main/kotlin/com/hippo/ehviewer/spider/**'
      - 'app/src/main/kotlin/com/hippo/ehviewer/download/**'
      - 'app/src/main/kotlin/com/hippo/ehviewer/ui/settings/DownloadScreen.kt'
      - 'app/src/main/kotlin/com/hippo/ehviewer/EhDB.kt'
      - 'core/data/src/commonMain/kotlin/com/ehviewer/core/database/dao/DownloadsDao.kt'
      - 'app/src/androidTest/**/DownloadProtectionTest.kt'
      - '.github/workflows/download-protection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-protection:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0 cmake;3.31.6 ndk;30.0.16248370'
      - name: Install native build prerequisites
        run: |
          command -v m4 || { sudo apt-get update && sudo apt-get install -y m4; }
          rustup toolchain install "$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')" --profile minimal --component rust-src,rustfmt,clippy --target aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: app/src/main/rust
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Check Kotlin and formatting
        run: ./gradlew :app:compileDefaultDebugAndroidTestKotlin spotlessCheck --no-configuration-cache --max-workers=2 -PbuildAbis=x86_64 -Pkotlin.compiler.execution.strategy=in-process
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run offline archive and restored-directory regressions
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          profile: pixel_6
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          heap-size: 512M
          force-avd-creation: true
          disable-animations: false
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            ./gradlew :app:connectedDefaultDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.hippo.ehviewer.spider.DownloadProtectionTest --no-configuration-cache --max-workers=2 -PbuildAbis=x86_64 -Pkotlin.compiler.execution.strategy=in-process --stacktrace
      - name: Show device assertions on failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for report in Path('app/build/outputs/androidTest-results').rglob('*.xml'):
              for case in ET.parse(report).iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      print(case.get('name'), failure.get('message', ''), (failure.text or '')[:4000])
          PY
      - name: Require all targeted device tests to pass
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases = [c for f in Path("app/build/outputs/androidTest-results").rglob("*.xml") for c in ET.parse(f).iter("testcase") if c.get("classname", "").endswith("DownloadProtectionTest")]
          required = {"nativeWriterReportsSourceAndOutputFailures", "interruptedDownloadKeepsOnlyVerifiedSourcesEligibleForCleanup", "restorationProtectsRenamedDirectoryBeforeAndAfterConfirmation", "publicationFailurePreservesSourceAndExistingUnmarkedArchive"}
          assert required <= {c.get("name") for c in cases}, "Missing device regressions"
          assert all(not list(c.findall("failure") + c.findall("error") + c.findall("skipped")) for c in cases)
          print("PASS", sorted(required))
          PY
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: download-protection-results
          path: app/build/outputs/androidTest-results/
          retention-days: 7
