name: Check focused Material UI

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'APK source to render; fixture follows this workflow revision'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'app/src/main/kotlin/com/hippo/ehviewer/ui/main/ArchiveList.kt'
      - 'app/src/main/kotlin/com/hippo/ehviewer/ui/main/FundsItem.kt'
      - 'app/src/test/kotlin/com/hippo/ehviewer/ui/settings/ThemeAndTooltipTest.kt'
      - 'app/src/main/kotlin/com/hippo/ehviewer/ui/reader/ImageInfoContent.kt'
      - 'app/src/main/kotlin/com/hippo/ehviewer/ui/main/AvatarIcon.kt'
      - 'app/src/main/kotlin/com/hippo/ehviewer/ui/main/GalleryViewToggle.kt'
      - 'app/src/main/kotlin/com/hippo/ehviewer/ui/settings/ThemeColorPreference.kt'
      - 'app/src/main/kotlin/com/hippo/ehviewer/ui/theme/**'
      - 'core/ui/src/commonMain/kotlin/com/ehviewer/core/ui/component/IconTooltip.kt'
      - '.github/workflows/archive-ui.yml'

permissions:
  contents: read

jobs:
  layout:
    name: layout-${{ inputs.source_commit || github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_commit || github.sha }}
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Load the UI fixture for this verification revision
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:app/src/test/kotlin/com/hippo/ehviewer/ui/settings/ThemeAndTooltipTest.kt" > "$RUNNER_TEMP/ThemeAndTooltipTest.kt"
          cp "$RUNNER_TEMP/ThemeAndTooltipTest.kt" app/src/test/kotlin/com/hippo/ehviewer/ui/settings/ThemeAndTooltipTest.kt
          git diff --exit-code -- app/src/main core
          git rev-parse HEAD
      - name: Check only theme choices and native tooltip interactions
        run: ./gradlew :app:testDefaultDebugUnitTest --tests '*ThemeAndTooltipTest' --no-configuration-cache --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process --stacktrace
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: archive-ui
          path: |
            app/build/reports/theme-tooltip-ui/
            app/build/reports/tests/testDefaultDebugUnitTest/
            app/build/test-results/testDefaultDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
