name: Check focused Material UI

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'APK source to render; fixture follows this workflow revision'
        required: false
        type: string
      fab_only:
        description: 'Run the same FAB hit tests against the selected source for comparison'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'app/src/main/kotlin/com/hippo/ehviewer/ui/main/ArchiveList.kt'
      - 'app/src/main/kotlin/com/hippo/ehviewer/ui/main/FundsItem.kt'
      - 'app/src/test/kotlin/com/hippo/ehviewer/ui/settings/ThemeAndTooltipTest.kt'
      - 'app/src/test/kotlin/com/hippo/ehviewer/ui/motion/FabLayoutHitTest.kt'
      - 'app/src/test/kotlin/com/hippo/ehviewer/ui/screen/GalleryDownloadButtonTest.kt'
      - 'app/src/main/kotlin/com/hippo/ehviewer/ui/reader/ImageInfoContent.kt'
      - 'app/src/main/kotlin/com/hippo/ehviewer/ui/main/AvatarIcon.kt'
      - 'app/src/main/kotlin/com/hippo/ehviewer/ui/main/GalleryViewToggle.kt'
      - 'app/src/main/kotlin/com/hippo/ehviewer/ui/screen/GalleryDetailScreen.kt'
      - 'app/src/main/kotlin/com/hippo/ehviewer/ui/screen/GalleryDetailContent.kt'
      - 'core/ui/src/commonMain/kotlin/com/ehviewer/core/ui/component/FabLayout.kt'
      - 'app/src/main/kotlin/com/hippo/ehviewer/ui/settings/ThemeColorPreference.kt'
      - 'app/src/main/kotlin/com/hippo/ehviewer/ui/settings/ThemePalette.kt'
      - 'app/src/main/kotlin/com/hippo/ehviewer/ui/theme/**'
      - 'core/ui/src/commonMain/kotlin/com/ehviewer/core/ui/component/IconTooltip.kt'
      - '.github/workflows/archive-ui.yml'

permissions:
  contents: read

jobs:
  layout:
    name: layout-${{ inputs.source_commit || github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_commit || github.sha }}
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Load the focused UI fixtures for this workflow revision
        env:
          FAB_ONLY: ${{ inputs.fab_only }}
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          suite_root=app/src/test/kotlin/com/hippo/ehviewer/ui
          fixtures=(motion/FabLayoutHitTest.kt)
          if [[ "$FAB_ONLY" != "true" ]]; then
            fixtures+=(settings/ThemeAndTooltipTest.kt screen/GalleryDownloadButtonTest.kt)
          fi
          for fixture in "${fixtures[@]}"; do
            mkdir -p "$suite_root/$(dirname "$fixture")"
            git show "$GITHUB_SHA:$suite_root/$fixture" > "$suite_root/$fixture"
          done
          git diff --exit-code -- app/src/main core
          git rev-parse HEAD
      - name: Check FAB hit targets and the selected UI changes
        env:
          FAB_ONLY: ${{ inputs.fab_only }}
        run: |
          filters=(--tests '*FabLayoutHitTest')
          if [[ "$FAB_ONLY" != "true" ]]; then
            filters+=(--tests '*ThemeAndTooltipTest' --tests '*GalleryDownloadButtonTest')
          fi
          ./gradlew :app:testDefaultDebugUnitTest "${filters[@]}" --no-configuration-cache --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process --stacktrace
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: archive-ui
          path: |
            app/build/reports/theme-tooltip-ui/
            app/build/reports/tests/testDefaultDebugUnitTest/
            app/build/test-results/testDefaultDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
