name: Verify and publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Signed draft release tag (v1.17.12)'
        required: true
        type: string
      source_commit:
        description: 'Full source commit SHA used by Build APKs'
        required: true
        type: string
      signed_blob:
        description: 'Git blob SHA of the locally signed public release ZIP'
        required: true
        type: string
      bundle_sha256:
        description: 'SHA-256 of the signed public release ZIP'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ inputs.tag }}
  SOURCE_COMMIT: ${{ inputs.source_commit }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools build-tools;36.0.0 build-tools;37.0.0'
      - name: Receive signed public APKs and populate draft
        env:
          SIGNED_BLOB: ${{ inputs.signed_blob }}
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, re, subprocess, zipfile
          from pathlib import Path
          from tools.release import ABIS, version
          sha, digest = os.environ['SIGNED_BLOB'], os.environ['BUNDLE_SHA256']
          assert re.fullmatch(r'[0-9a-f]{40}', sha)
          assert re.fullmatch(r'[0-9a-f]{64}', digest)
          release = json.loads(subprocess.check_output(['gh', 'release', 'view', os.environ['TAG'], '--json', 'isDraft,targetCommitish']))
          assert release['isDraft'] and release['targetCommitish'] == os.environ['SOURCE_COMMIT']
          blob = json.loads(subprocess.check_output(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{sha}"]))
          assert blob['encoding'] == 'base64'
          data = base64.b64decode(blob['content'])
          assert hashlib.sha256(data).hexdigest() == digest
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
          expected = {f'EhViewer-{version()[0]}-{abi}.apk' for abi in ABIS} | {'release-info.json', 'SHA256SUMS.txt'}
          output = Path('delivery')
          output.mkdir()
          with zipfile.ZipFile(io.BytesIO(data)) as bundle:
              assert set(bundle.namelist()) == expected and len(bundle.infolist()) == len(expected)
              assert sum(item.file_size for item in bundle.infolist()) < 300_000_000
              for name in expected:
                  (output / name).write_bytes(bundle.read(name))
          PY
          python3 tools/release.py verify --input delivery
          for apk in delivery/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          done
          gh release upload "$TAG" delivery/* --clobber

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # GitHub exposes draft releases only to identities with push access.
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        api: [26, 33, '37.2']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools build-tools;37.0.0'
      - name: Download and verify signed draft
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          tag, sha = os.environ['TAG'], os.environ['SOURCE_COMMIT']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag)
          assert re.fullmatch(r'[0-9a-f]{40}', sha)
          release = json.loads(subprocess.check_output(['gh', 'release', 'view', tag, '--json', 'isDraft,targetCommitish']))
          assert release['isDraft'] and release['targetCommitish'] == sha
          PY
          gh release download "$TAG" --dir delivery
          python3 tools/release.py verify --input delivery
          python3 - <<'PY'
          import json, subprocess, os
          from pathlib import Path
          info = json.loads(Path('delivery/release-info.json').read_text())
          endpoint = f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{int(info['buildRunId'])}"
          run = json.loads(subprocess.check_output(['gh', 'api', endpoint]))
          assert run['head_sha'] == os.environ['SOURCE_COMMIT']
          assert run['path'] == '.github/workflows/build.yml'
          assert run['conclusion'] in (None, 'success')
          # The run/job summary can lag behind the completed step records.
          jobs = json.loads(subprocess.check_output(['gh', 'api', endpoint + '/jobs?filter=latest']))['jobs']
          assert len(jobs) == 1 and jobs[0]['name'] == 'build'
          assert jobs[0]['head_sha'] == os.environ['SOURCE_COMMIT']
          steps = jobs[0]['steps']
          required = {'Check release metadata, Kotlin and formatting', 'Build all release architectures', 'Package unsigned APKs', 'Complete job'}
          assert required <= {step['name'] for step in steps}
          assert all(step['status'] == 'completed' and step['conclusion'] == 'success' for step in steps)
          print('Verified source commit and every completed build step, including job finalization')
          ui_runs = json.loads(subprocess.check_output(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs?per_page=50"]))['workflow_runs']
          ui_verified = False
          for ui in ui_runs:
              if ui['path'] != '.github/workflows/archive-ui.yml' or ui['conclusion'] != 'success':
                  continue
              ui_jobs = json.loads(subprocess.check_output(['gh', 'api', ui['jobs_url']]))['jobs']
              if len(ui_jobs) != 1 or ui_jobs[0]['name'] != f"layout-{os.environ['SOURCE_COMMIT']}":
                  continue
              assert all(s['status'] == 'completed' and s['conclusion'] == 'success' for s in ui_jobs[0]['steps'])
              ui_verified = True
              print(f"Verified focused archive UI layout for the APK source in run {ui['id']}")
              break
          assert ui_verified, 'Archive UI layout checks must pass for the exact APK source before release'
          PY
      - name: Download migration baseline
        if: matrix.api == 33
        run: |
          previous_release_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          test "$previous_release_tag" != "$TAG"
          gh release download "$previous_release_tag" --pattern '*universal.apk' --pattern '*x86_64.apk' --dir baseline
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Load focused install checks from this workflow revision
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:tools/smoke.py" > "$RUNNER_TEMP/smoke.py"
          git show "$GITHUB_SHA:tools/install_check.py" > "$RUNNER_TEMP/ehviewer-install-check.py"
      - uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api }}
          system-image-api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api == '37.2' && 'google_apis_ps16k' || 'google_apis' }}
          ram-size: 4096M
          heap-size: 512M
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            test '${{ matrix.api }}' = 33 || adb root
            adb wait-for-device
            adb shell dumpsys webviewupdate
            python3 "$RUNNER_TEMP/ehviewer-install-check.py" --apks delivery --output install-check
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: install-api-${{ matrix.api }}
          path: install-check/
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools build-tools;37.0.0'
      - name: Reverify and publish
        run: |
          gh release download "$TAG" --dir delivery
          python3 tools/release.py verify --input delivery
          gh release edit "$TAG" --draft=false --latest
      - name: Re-download the public release URLs and verify the delivered bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess, urllib.request
          info = json.loads(Path('delivery/release-info.json').read_text())
          release = json.loads(subprocess.check_output(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/{os.environ['TAG']}"]))
          assert not release['draft']
          assets = {a['name']: a for a in release['assets']}
          for name, digest in info['files'].items():
              with urllib.request.urlopen(assets[name]['browser_download_url'], timeout=90) as response:
                  actual = hashlib.file_digest(response, 'sha256').hexdigest()
              assert actual == digest, f'Public download bytes differ: {name}'
              print(f'PASS: public browser download SHA-256: {name}: {actual}')
          PY
