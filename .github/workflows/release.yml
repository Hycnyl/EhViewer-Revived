name: Verify and publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Signed draft release tag (v1.17.14)'
        required: true
        type: string
      source_commit:
        description: 'Full source commit SHA used by Build APKs'
        required: true
        type: string
      signed_blob:
        description: 'Git blob SHA of the locally signed public release ZIP'
        required: true
        type: string
      bundle_sha256:
        description: 'SHA-256 of the signed public release ZIP'
        required: true
        type: string
      focused_ui_workflow:
        description: 'Focused UI checks appropriate to this release'
        required: false
        type: choice
        options: [interaction-ui.yml, archive-ui.yml]
        default: interaction-ui.yml
      quick_release:
        description: 'Scoped UI patch: omit optional UI suites and use one Android 13 install/upgrade check'
        required: false
        type: boolean
        default: false
      reuse_validation_run:
        description: 'Optional prior run for identical signed bytes with successful API 26/33 jobs'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ inputs.tag }}
  SOURCE_COMMIT: ${{ inputs.source_commit }}
  UI_WORKFLOW: ${{ inputs.focused_ui_workflow }}
  QUICK_RELEASE: ${{ inputs.quick_release && 'true' || 'false' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      target_sdk: ${{ steps.receive.outputs.target_sdk }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools build-tools;36.0.0 build-tools;37.0.0'
      - name: Receive signed public APKs and populate draft
        id: receive
        env:
          SIGNED_BLOB: ${{ inputs.signed_blob }}
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, re, subprocess, zipfile
          from pathlib import Path
          from tools.release import ABIS, target_sdk, version
          sha, digest = os.environ['SIGNED_BLOB'], os.environ['BUNDLE_SHA256']
          assert re.fullmatch(r'[0-9a-f]{40}', sha)
          assert re.fullmatch(r'[0-9a-f]{64}', digest)
          release = json.loads(subprocess.check_output(['gh', 'release', 'view', os.environ['TAG'], '--json', 'isDraft,targetCommitish']))
          assert release['isDraft'] and release['targetCommitish'] == os.environ['SOURCE_COMMIT']
          blob = json.loads(subprocess.check_output(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{sha}"]))
          assert blob['encoding'] == 'base64'
          data = base64.b64decode(blob['content'])
          assert hashlib.sha256(data).hexdigest() == digest
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
          expected = {f'EhViewer-{version()[0]}-{abi}.apk' for abi in ABIS} | {'release-info.json', 'SHA256SUMS.txt'}
          output = Path('delivery')
          output.mkdir()
          with zipfile.ZipFile(io.BytesIO(data)) as bundle:
              assert set(bundle.namelist()) == expected and len(bundle.infolist()) == len(expected)
              assert sum(item.file_size for item in bundle.infolist()) < 300_000_000
              for name in expected:
                  (output / name).write_bytes(bundle.read(name))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as result:
              result.write(f'target_sdk={target_sdk()}\n')
          PY
          python3 tools/release.py verify --input delivery
          for apk in delivery/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          done
          gh release upload "$TAG" delivery/* --clobber
      - name: Verify reusable Android 8 and 13 results for the identical signed bundle
        if: inputs.reuse_validation_run
        env:
          REUSE_RUN: ${{ inputs.reuse_validation_run }}
          SIGNED_BLOB: ${{ inputs.signed_blob }}
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          run_id = os.environ['REUSE_RUN']
          assert re.fullmatch(r'[0-9]+', run_id)
          base = f"repos/{os.environ['GITHUB_REPOSITORY']}/actions"
          run = json.loads(subprocess.check_output(['gh', 'api', f'{base}/runs/{run_id}']))
          assert run['path'] == '.github/workflows/release.yml'
          jobs = json.loads(subprocess.check_output(['gh', 'api', f'{base}/runs/{run_id}/jobs']))['jobs']
          previous = {j['name']: j for j in jobs}
          assert previous['prepare']['conclusion'] == 'success'
          logs = subprocess.check_output(['gh', 'api', '--allow-escape-sequences', f"{base}/jobs/{previous['prepare']['id']}/logs"]).decode()
          for key in ('TAG', 'SOURCE_COMMIT', 'SIGNED_BLOB', 'BUNDLE_SHA256'):
              assert f"{key}: {os.environ[key]}" in logs, f'Previous bundle/input differs: {key}'
          for name in ('verify (26)', 'verify (33)'):
              job = previous[name]
              assert job['status'] == 'completed' and job['conclusion'] == 'success'
              required = {'Download and verify signed draft', 'Run ReactiveCircus/android-emulator-runner@v2.38.0', 'Complete job'}
              passed = {s['name'] for s in job['steps'] if s['status'] == 'completed' and s['conclusion'] == 'success'}
              assert required <= passed
              print(f"Reused successful {name} from run {run_id} for the identical signed APK bundle")
          PY

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # GitHub exposes draft releases only to identities with push access.
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(inputs.quick_release && '[33]' || (inputs.reuse_validation_run && '["37.2"]' || (needs.prepare.outputs.target_sdk == '37' && '[26,33,"37.2"]' || '[26,33,36]'))) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools build-tools;37.0.0'
      - name: Download and verify signed draft
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          tag, sha = os.environ['TAG'], os.environ['SOURCE_COMMIT']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag)
          assert re.fullmatch(r'[0-9a-f]{40}', sha)
          release = json.loads(subprocess.check_output(['gh', 'release', 'view', tag, '--json', 'isDraft,targetCommitish']))
          assert release['isDraft'] and release['targetCommitish'] == sha
          PY
          gh release download "$TAG" --dir delivery
          python3 tools/release.py verify --input delivery
          python3 - <<'PY'
          import json, subprocess, os
          from pathlib import Path
          info = json.loads(Path('delivery/release-info.json').read_text())
          endpoint = f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{int(info['buildRunId'])}"
          run = json.loads(subprocess.check_output(['gh', 'api', endpoint]))
          assert run['head_sha'] == os.environ['SOURCE_COMMIT']
          assert run['path'] == '.github/workflows/build.yml'
          assert run['conclusion'] in (None, 'success')
          # The run/job summary can lag behind the completed step records.
          jobs = json.loads(subprocess.check_output(['gh', 'api', endpoint + '/jobs?filter=latest']))['jobs']
          assert len(jobs) == 1 and jobs[0]['name'] == 'build'
          assert jobs[0]['head_sha'] == os.environ['SOURCE_COMMIT']
          steps = jobs[0]['steps']
          required = {'Check release metadata, Kotlin and formatting', 'Require reader profile coverage', 'Build all release architectures', 'Package unsigned APKs', 'Complete job'}
          assert required <= {step['name'] for step in steps}
          optional_profile_steps = {'Reuse release profiles for a scoped patch', 'Enable emulator acceleration', 'Generate current offline Baseline and Startup Profiles'}
          assert required <= {step['name'] for step in steps if step['conclusion'] == 'success'}
          assert all(step['status'] == 'completed' and (step['conclusion'] == 'success' or (step['name'] in optional_profile_steps and step['conclusion'] == 'skipped')) for step in steps)
          print('Verified source commit and every completed build step, including job finalization')
          if os.environ['QUICK_RELEASE'] != 'true':
              ui_runs = json.loads(subprocess.check_output(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs?per_page=50"]))['workflow_runs']
              ui_verified = False
              for ui in ui_runs:
                  if ui['path'] != '.github/workflows/' + os.environ['UI_WORKFLOW'] or ui['conclusion'] != 'success':
                      continue
                  ui_jobs = json.loads(subprocess.check_output(['gh', 'api', ui['jobs_url']]))['jobs']
                  prefix = 'interaction' if ui['path'].endswith('interaction-ui.yml') else 'layout'
                  if len(ui_jobs) != 1 or not ui_jobs[0]['name'].startswith(prefix + '-'):
                      continue
                  ui_source = ui_jobs[0]['name'][len(prefix)+1:]
                  if len(ui_source) != 40 or any(c not in '0123456789abcdef' for c in ui_source):
                      continue
                  if ui_source != os.environ['SOURCE_COMMIT']:
                      subprocess.check_call(['git', 'fetch', '--no-tags', '--depth=1', 'origin', ui_source])
                      # A benchmark-only fixture fix does not change the UI previously rendered.
                      relevant = ['app/src/main', 'app/src/test', 'core', 'app/build.gradle.kts', 'app/proguard-rules.pro', 'build.gradle.kts', 'settings.gradle.kts', 'build-logic', 'gradle', 'gradle.properties', '.github/workflows/' + os.environ['UI_WORKFLOW']]
                      difference = subprocess.run(['git', 'diff', '--quiet', ui_source, os.environ['SOURCE_COMMIT'], '--', *relevant])
                      if difference.returncode == 1:
                          continue
                      difference.check_returncode()
                      print(f'UI source and build configuration unchanged since validated {ui_source}')
                  assert all(s['status'] == 'completed' and s['conclusion'] == 'success' for s in ui_jobs[0]['steps'])
                  ui_verified = True
                  print(f"Verified focused UI checks for the APK source in run {ui['id']}")
                  break
              assert ui_verified, 'Relevant focused UI checks must pass for the APK source or identical UI/build inputs before release'
          else:
              print('Optional focused UI suite omitted for the explicitly requested scoped quick release')
          PY
      - name: Download migration baseline
        if: matrix.api == 33
        run: |
          previous_release_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          test "$previous_release_tag" != "$TAG"
          gh release download "$previous_release_tag" --pattern '*universal.apk' --pattern '*x86_64.apk' --dir baseline
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Load focused install checks from this workflow revision
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:tools/smoke.py" > "$RUNNER_TEMP/smoke.py"
          git show "$GITHUB_SHA:tools/install_check.py" > "$RUNNER_TEMP/ehviewer-install-check.py"
      - uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api }}
          system-image-api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ (matrix.api == 36 || matrix.api == '37.2') && 'google_apis_ps16k' || 'google_apis' }}
          ram-size: 4096M
          heap-size: 512M
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu ${{ matrix.api == '37.2' && 'software' || 'swiftshader_indirect' }} -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            test '${{ matrix.api }}' = 33 || adb root
            adb wait-for-device
            adb shell dumpsys webviewupdate
            python3 "$RUNNER_TEMP/ehviewer-install-check.py" --apks delivery --output install-check
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: install-api-${{ matrix.api }}
          path: install-check/
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools build-tools;37.0.0'
      - name: Reverify and publish
        run: |
          gh release download "$TAG" --dir delivery
          python3 tools/release.py verify --input delivery
          gh release edit "$TAG" --draft=false --latest
      - name: Re-download the public release URLs and verify the delivered bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess, urllib.request
          info = json.loads(Path('delivery/release-info.json').read_text())
          release = json.loads(subprocess.check_output(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/{os.environ['TAG']}"]))
          assert not release['draft']
          assets = {a['name']: a for a in release['assets']}
          for name, digest in info['files'].items():
              with urllib.request.urlopen(assets[name]['browser_download_url'], timeout=90) as response:
                  actual = hashlib.file_digest(response, 'sha256').hexdigest()
              assert actual == digest, f'Public download bytes differ: {name}'
              print(f'PASS: public browser download SHA-256: {name}: {actual}')
          PY
