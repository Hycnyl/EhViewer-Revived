name: Check interaction motion

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'APK source to render; fixture follows this workflow revision'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'app/src/main/kotlin/com/hippo/ehviewer/ui/MainActivity.kt'
      - 'app/src/main/kotlin/com/hippo/ehviewer/ui/main/GalleryList.kt'
      - 'core/ui/src/commonMain/kotlin/com/ehviewer/core/ui/component/LazyGrid.kt'
      - 'core/ui/src/commonMain/kotlin/com/ehviewer/core/ui/component/ElasticOverscroll.kt'
      - 'core/ui/src/commonMain/kotlin/androidx/compose/material3/SideDrawer.kt'
      - 'app/src/main/kotlin/com/hippo/ehviewer/ui/theme/Theme.kt'
      - 'app/src/main/kotlin/com/hippo/ehviewer/ui/reader/PagerViewer.kt'
      - 'app/src/main/kotlin/com/hippo/ehviewer/ui/reader/WebtoonViewer.kt'
      - 'app/src/test/kotlin/com/hippo/ehviewer/ui/motion/InteractionMotionTest.kt'
      - '.github/workflows/interaction-ui.yml'

permissions:
  contents: read

jobs:
  layout:
    name: interaction-${{ inputs.source_commit || github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_commit || github.sha }}
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Load the UI fixture for this verification revision
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:app/src/test/kotlin/com/hippo/ehviewer/ui/motion/InteractionMotionTest.kt" > "$RUNNER_TEMP/InteractionMotionTest.kt"
          cp "$RUNNER_TEMP/InteractionMotionTest.kt" app/src/test/kotlin/com/hippo/ehviewer/ui/motion/InteractionMotionTest.kt
          git diff --exit-code -- app/src/main core
          git rev-parse HEAD
      - name: Check edge bounds, interruption and ordinary scrolling
        run: ./gradlew :app:testDefaultDebugUnitTest --tests '*InteractionMotionTest' --no-configuration-cache --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process --stacktrace
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: interaction-ui
          path: |
            app/build/reports/tests/testDefaultDebugUnitTest/
            app/build/test-results/testDefaultDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
