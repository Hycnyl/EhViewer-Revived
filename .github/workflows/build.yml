name: Build APKs

on:
  push:
    branches: [main]
    paths: ['app/**', 'benchmark/**', 'core/**', 'gradle/**', 'build-logic/**', 'tools/**', 'rust-toolchain.toml', '*.gradle.kts', 'gradle.properties', '.github/workflows/build.yml', '!tools/smoke.py', '!tools/install_check.py', '!tools/apk_signature.py', '!app/src/test/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0 cmake;3.31.6 ndk;30.0.16248370'
      - name: Install native build prerequisites
        run: |
          command -v m4 || { sudo apt-get update && sudo apt-get install -y m4; }
          rustup toolchain install "$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')" --profile minimal --component rust-src,rustfmt,clippy --target aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: app/src/main/rust
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Check release metadata, Kotlin and formatting
        run: ./gradlew :app:checkDefaultReleaseAarMetadata :app:compileDefaultReleaseKotlin spotlessCheck --no-configuration-cache --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Generate current offline Baseline and Startup Profiles
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          profile: pixel_6
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          heap-size: 512M
          force-avd-creation: true
          disable-animations: false
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            ./gradlew :app:generateBaselineProfile --no-configuration-cache --max-workers=2 -PbuildAbis=x86_64 -Pkotlin.compiler.execution.strategy=in-process --stacktrace
      - name: Require fresh reader profile coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          profiles = list(Path('app/src/main/generated/baselineProfiles').glob('*-prof.txt'))
          assert profiles, 'No newly generated profiles'
          content = '\n'.join(p.read_text() for p in profiles)
          for component in ('ReaderScreenKt', 'PagerViewerKt', 'WebtoonViewerKt', 'PageLoader'):
              assert component in content, f'Missing reader coverage: {component}'
          assert 'Lcom/hippo/ehviewer/benchmark/' not in content, 'Fixture leaked into profile'
          print('PASS: fresh baseline/startup profiles cover both actual readers')
          PY
      - name: Build all release architectures
        run: ./gradlew :app:assembleDefaultRelease --no-configuration-cache --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process --stacktrace
      - name: Package unsigned APKs
        run: python3 tools/release.py package --input app/build/outputs/apk/default/release --output delivery
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: unsigned-release-${{ github.sha }}
          path: delivery/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: build-diagnostics-${{ github.sha }}
          path: |
            app/build/outputs/mapping/defaultRelease/
            build/reports/problems/
            app/src/main/generated/baselineProfiles/
            benchmark/build/outputs/
            benchmark/build/reports/
          retention-days: 7
