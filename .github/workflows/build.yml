name: Build APKs

on:
  push:
    branches: [main]
    paths: ['app/**', 'core/**', 'gradle/**', 'build-logic/**', 'tools/**', 'rust-toolchain.toml', '*.gradle.kts', 'gradle.properties', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 cmake;3.31.6 ndk;30.0.16248370'
      - name: Install native build prerequisites
        run: |
          command -v m4 || { sudo apt-get update && sudo apt-get install -y m4; }
          rustup toolchain install "$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')" --profile minimal --component rust-src,rustfmt,clippy --target aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: app/src/main/rust
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Build all release architectures
        run: ./gradlew :app:assembleDefaultRelease --no-configuration-cache --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process --stacktrace
      - name: Package unsigned APKs
        run: python3 tools/release.py package --input app/build/outputs/apk/default/release --output delivery
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: unsigned-release-${{ github.sha }}
          path: delivery/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: build-diagnostics-${{ github.sha }}
          path: |
            app/build/outputs/mapping/defaultRelease/
            build/reports/problems/
          retention-days: 7
