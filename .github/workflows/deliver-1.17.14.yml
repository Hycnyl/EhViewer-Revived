name: Finish 1.17.14 source cleanup

on:
  push:
    branches: [main]
    paths: [.github/workflows/deliver-1.17.14.yml]

permissions:
  contents: write
  actions: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove the pinned source branch after successful publication
        run: |
          python3 - <<'PY_CLEANUP'
          import json, os, subprocess, time
          repo = os.environ['GITHUB_REPOSITORY']
          source = '5f12a93ec5a667570639c66caec9aa2968a1b773'
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{path}']))
          for attempt in range(50):
              jobs = api('actions/runs/42203235839/jobs?filter=latest')['jobs']
              if jobs and all(j['status'] == 'completed' and j['conclusion'] == 'success' for j in jobs):
                  break
              assert not any(j['conclusion'] in ('failure', 'cancelled', 'timed_out') for j in jobs)
              time.sleep(10)
          else:
              raise RuntimeError('Delivery did not complete')
          release = api('releases/tags/v1.17.14')
          assert not release['draft'] and release['target_commitish'] == source
          ref = api('git/ref/heads/release-source-1.17.14')
          assert ref['object']['sha'] == source
          subprocess.run(['gh', 'api', '--method', 'DELETE', f'repos/{repo}/git/refs/heads/release-source-1.17.14'], check=True)
          print('PASS: published 1.17.14 verified and temporary source branch removed')
          PY_CLEANUP
